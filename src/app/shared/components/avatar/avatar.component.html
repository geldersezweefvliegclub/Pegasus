<img defaultImage="/assets/img/avatar.png" alt="Avatar klein" [lazyLoad]="url" [class]="vorm" class="clickable" (click)="showPopup()" />

<app-modal [titel]="naam">
    <div body>
        @if (url && ref.children.length === 0) {
            <img class="volBeeld" alt="Avatar groot" [src]="url">
        }
        <div #ref>
            <ng-content></ng-content>
        </div>
    </div>
</app-modal>
