<app-error [error]='error'/>
<app-success [success]='success'/>

<app-modal [titel]="formTitel">
    @if (aanwezig) {
        <div body>
            <fieldset>
                <label for="VELD" class="form-label">Veld</label>
                <select class="form-select"
                        id="VELD"
                        name="VELD"
                        required
                        [(ngModel)]="aanwezig.VELD_ID">
                    <!-- null: leeg van de server of leeggemaakt, undefined: nog niet ingevuld (verborgen) -->
                    <option [ngValue]="null" disabled>Vliegveld</option>
                    <option [ngValue]="undefined" disabled hidden>Vliegveld</option>
                    @for (item of veldenTypes; track item.ID) {
                        <option [ngValue]="item.ID">{{ item.OMSCHRIJVING }}</option>
                    }
                </select>
                @if (!isDDWVer) {
                    <div class="mt-2">
                        <label class="form-label">Vliegtuig types</label>
                        @if (aanwezig) {
                            <div class="row">
                                <div class="ms-2">
                                    <table>
                                        @for (t of vliegtuigTypes; track t.ID; let i = $index) {
                                            <tr>
                                                <td class="kolom1">
                                                    <input type="checkbox"
                                                           [ngModel]="t.Geselecteerd"
                                                           class="form-check-inline"
                                                           (change)="zetVoorkeur($event, t.ID)">
                                                </td>
                                                <td class="kolom2">
                                                    {{ t.OMSCHRIJVING }}
                                                </td>
                                            </tr>
                                        }
                                    </table>
                                </div>
                </div>
                        }
            </div>
                }
                <app-vliegtuig-invoer id="VLIEGTUIG"
                                      [VLIEGTUIG_ID]="aanwezig.OVERLAND_VLIEGTUIG_ID"
                                      [vliegtuigen]="vliegtuigenFiltered"
                                      (VliegtuigChanged)="aanwezig.OVERLAND_VLIEGTUIG_ID = $event"
                                      label="Overland"
                                      verplicht="false"
                />
                <div class="mt-2 px-2">
                    <label class="form-label" for="OPMERKINGEN">Opmerking</label>
                    <textarea [(ngModel)]="aanwezig.OPMERKINGEN"
                              class="w-100 text-invoer form-control"
                              id="OPMERKINGEN"
                              rows="2"></textarea>
                </div>
        </fieldset>
        </div>
    }
    <div footer class="w-100">
        <div class="d-flex justify-content-between">
            <div>&nbsp;</div> <!-- zet de opslaan knop op rechts -->
            @if (!isLoading && !isSaving) {
                <app-icon-button iconNaam="fas Edit" btnColor="btn-primary" [toonKlein]=false
                                 tekst='Opslaan' (btnClicked)='opslaan()' [disabled]='knopUit()'/>
            } @if (isLoading || isSaving) {
            <button class="btn btn-primary">
                <span><app-loader/></span>
            </button>
        }
        </div>
    </div>
</app-modal>
