<app-modal titel="Meteo wizard">
    <div body>
        <div class="row">
            <div class="col-6">
                <div class="">
                    <label for="WINDRICHTING" class="form-label">Windrichting</label>
                    <select class="form-select"
                            id="WINDRICHTING"
                            name="WINDRICHTING"
                            [(ngModel)]="windRichting">
                        <!-- null: leeg van de server of leeggemaakt, undefined: nog niet ingevuld (verborgen) -->
                        <option [ngValue]="null"None></option>
                        <option [ngValue]="undefined" disabled hidden></option>
                        @for (item of windRichtingTypes; track item.ID) {
                            <option [ngValue]="item.OMSCHRIJVING">{{ item.OMSCHRIJVING }}</option>
                        }
                    </select>
                </div>
                <div class="mt-2">
                    <label for="WINDKRACHT" class="form-label">Windkracht</label>
                    <select class="form-select"
                            id="WINDKRACHT"
                            name="WINDKRACHT"
                            [(ngModel)]="windKracht">
                        <!-- null: leeg van de server of leeggemaakt, undefined: nog niet ingevuld (verborgen) -->
                        <option [ngValue]="null"None></option>
                        <option [ngValue]="undefined" disabled hidden></option>
                        @for (item of windSterkteTypes; track item.ID) {
                            <option [ngValue]="item.OMSCHRIJVING">{{ item.OMSCHRIJVING }}</option>
                        }
                    </select>
                </div>
                <div class="mt-2">
                    <label for="EIGENSCHAPPEN" class="form-label">Wind eigenschappen</label>
                    <select class="form-select"
                            id="EIGENSCHAPPEN"
                            name="EIGENSCHAPPEN"
                            [(ngModel)]="windEigenschappen">
                        <!-- null: leeg van de server of leeggemaakt, undefined: nog niet ingevuld (verborgen) -->
                        <option [ngValue]="null"None></option>
                        <option [ngValue]="undefined" disabled hidden></option>
                        @for (item of windEigenschappenTypes; track item.ID) {
                            <option [ngValue]="item.OMSCHRIJVING">{{ item.OMSCHRIJVING }}</option>
                        }
                    </select>
                </div>
                <div class="mt-2">
                    <label for="TERMIEK" class="form-label">Gemiddeld stijgen</label>
                    <select class="form-select"
                            id="TERMIEK"
                            name="TERMIEK"
                            [(ngModel)]="gemiddeldStijgen">
                        <!-- null: leeg van de server of leeggemaakt, undefined: nog niet ingevuld (verborgen) -->
                        <option [ngValue]="null"None></option>
                        <option [ngValue]="undefined" disabled hidden></option>
                        @for (item of stijgenTypes; track item.ID) {
                            <option [ngValue]="item.CODE">{{ item.OMSCHRIJVING }}</option>
                        }
                    </select>
                </div>
            </div>
            <div class="col-6">
                <div class="">
                    <label for="ZICHT" class="form-label">Zicht</label>
                    <select class="form-select"
                            id="ZICHT"
                            name="ZICHT"
                            [(ngModel)]="zicht">
                        <!-- null: leeg van de server of leeggemaakt, undefined: nog niet ingevuld (verborgen) -->
                        <option [ngValue]="null"None></option>
                        <option [ngValue]="undefined" disabled hidden></option>
                        @for (item of zichtTypes; track item.ID) {
                            <option [ngValue]="item.OMSCHRIJVING">{{ item.OMSCHRIJVING }}</option>
                        }
                    </select>
                </div>
                <div class="mt-2">
                    <label for="BEWOLKING" class="form-label">Bewolking</label>
                    <select class="form-select"
                            id="BEWOLKING"
                            name="BEWOLKING"
                            [(ngModel)]="bewolking">
                        <!-- null: leeg van de server of leeggemaakt, undefined: nog niet ingevuld (verborgen) -->
                        <option [ngValue]="null"None></option>
                        <option [ngValue]="undefined" disabled hidden></option>
                        @for (item of bewolkingTypes; track item.ID) {
                            <option [ngValue]="item.OMSCHRIJVING">{{ item.OMSCHRIJVING }}</option>
                        }
                    </select>
                </div>
                <div class="mt-2">
                    <label for="BEDEKKING" class="form-label">Bedekkingsgraad</label>
                    <select class="form-select"
                            id="BEDEKKING"
                            name="BEDEKKING"
                            [(ngModel)]="bewolkingDekking">
                        <!-- null: leeg van de server of leeggemaakt, undefined: nog niet ingevuld (verborgen) -->
                        <option [ngValue]="null"None></option>
                        <option [ngValue]="undefined" disabled hidden></option>
                        @for (item of dekkingTypes; track item.ID) {
                            <option [ngValue]="item.OMSCHRIJVING">{{ item.OMSCHRIJVING }}</option>
                        }
                    </select>
                </div>
                <div class="mt-2">
                    <label for="WOLKENBASIS" class="form-label">Wolkenbasis</label>
                    <input name="Wolkenbasis" type="number" class="form-control" id="WOLKENBASIS"
                           [(ngModel)]="wolkenBasis"
                           min="300" max="1500" step="100">
                </div>
            </div>
        </div>
    </div>
    <div footer>
        <app-icon-button iconNaam="fas Edit" btnColor="btn-primary"
                         tekst='Overnemen' (btnClicked)='Compose()'/>
    </div>
</app-modal>
