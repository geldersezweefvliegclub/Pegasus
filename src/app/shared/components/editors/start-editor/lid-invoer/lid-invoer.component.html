@if (label) {
    <label for="LID" class="form-label" [ngClass]="{'labelDisabled': disabled }">{{ label }}</label>
} @if (uitleg) {
    <fa-icon class="text-info ms-2 clickable" [icon]="infoIcon"
             [ngbPopover]="uitleg"
             placement="right"></fa-icon>
}

<ng-select id="LID"
           [items]="ledenSelectie$ | async"
           [disabled]="disabled"
           [placeholder]="placeholder"
           [required]="required"
           bindLabel="NAAM"
           bindValue="LID_ID"
           closeOnSelect="true"
           openOnEnter="true"
           (ngModelChange)="inputChange($event)"
           [typeahead]="lidInput$"
           [(ngModel)]="LID_ID">
</ng-select>
