<button class="btn" [class]="{'btn-primary':actief, 'btn-outline-primary': !actief}"  type="button" [disabled]="disabled()"  (click)="buttonClicked()">
    <div class="d-flex">
        @if (faIcon) {
            <fa-icon [icon]='faIcon'/>
        } @if (toonTekst || !toonKlein()) {
        <div [class.ms-3]="tekst().length > 0">{{ tekst() }}</div>
    }
    </div>
</button>
