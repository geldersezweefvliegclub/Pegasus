<button class="btn" [ngClass]="{'btn-primary':actief, 'btn-outline-primary': !actief}"  type="button" [disabled]="disabled"  (click)="buttonClicked()">
    <div class="d-flex">
        @if (faIcon) {
            <fa-icon [icon]="faIcon"></fa-icon>
        } @if (toonTekst || !toonKlein) {
        <div [ngClass]="{'ms-3': tekst.length > 0}">{{ tekst }}</div>
    }
    </div>
</button>
