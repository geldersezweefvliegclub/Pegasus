<app-modal popupClass="popupLarge" titel="Recency verloop {{naam}} over 24 maanden">
    <div body>
        @if (bezig) {
            <div>
                <ngb-progressbar type="info" [value]="counter" showValue="true" max="36"
                                 [striped]="true"></ngb-progressbar>
            </div>
        } @if (!bezig) {
        <div class="barchart-wrapper popupLargeWrapper">
            <div class="linechart-wrapper inlineGrafiek">
                @if (lierstarts.length > 0) {
                    <canvas class="recencyGrafiek" baseChart
                            style="width: inherit;height: 65vh;"
                            [type]="'line'"
                            [datasets]="startsLineChartData"
                            [labels]="startsLineChartLabels"
                            [options]="startsLineChartOptions">
                    </canvas>
                }
            </div>
        </div>
    }
    </div>
</app-modal>
