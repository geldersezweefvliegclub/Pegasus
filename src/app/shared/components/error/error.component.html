@if (error) {
    <div
            id="errorOverlay"
            #errorOverlay
            [ngClass]="showError ? 'show' : ''"
            class="alert alert-dismissable alert-danger"
            role="alert">
    <div class="fw-bold">Foutmelding!</div>
    <div>{{error.beschrijving}}</div>
    </div>
}
