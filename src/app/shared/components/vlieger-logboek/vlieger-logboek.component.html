<app-error [error]='error'/>
<app-success [success]='success'/>

@if (!toonLogboekKlein) {
    <div class="gridHoogte">
        <app-datatable [id]=id()
            [rowData]="data"
            [columnDefs]="columns"
            [loading]="isLoading"
            [rowClassRules]="rowClassRules"
            [frameworkComponents]="frameworkComponents"
            (rowDoubleClicked)="openStartEditor($event.data)"
            [pagination]="true"
                       class='h-100'/>
    </div>
} @if (toonLogboekKlein) {
    <div class="mobielHoogte">
        @for (vlucht of data; track vlucht; let i = $index) {
            <div>
                @if (i < MaxItems()) {
                    <div>
                        <app-vlucht-card [logboek]='vlucht'/>
                    </div>
                }
            </div>
        }
    </div>
}

<app-tijd-invoer/>
<app-start-editor [VliegerID]='VliegerID()'/>
<app-track-editor/>
