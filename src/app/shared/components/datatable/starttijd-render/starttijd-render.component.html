@if (params.data.inTijdspan) {
    <div>
        @if (this.startTijd) {
            <div class="starttijd" (click)="tijdClicked()">{{ startTijd }}</div>
        } @if (!this.startTijd && params.data.STARTMETHODE) {
        <app-icon-button class="toolbarBtn" iconNaam="fas PlaneDeparture" (btnClicked)="tijdClicked()"
                         btnColor="startBtn"></app-icon-button>
    }
    </div>
} @if (!params.data.inTijdspan) {
    <div>{{ startTijd }}</div>
}
