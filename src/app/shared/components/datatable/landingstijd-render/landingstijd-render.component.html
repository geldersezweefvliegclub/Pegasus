@if (params.data.inTijdspan) {
    <div>
        @if (this.landingsTijd) {
            <div class="landingstijd" (click)="tijdClicked()">{{ landingsTijd }}</div>
        } @if (this.toonButton) {
        <app-icon-button class="toolbarBtn" iconNaam="fas PlaneArrival" (btnClicked)="tijdClicked()"
                         btnColor="landingsBtn"></app-icon-button>
    }
    </div>
} @if (!params.data.inTijdspan) {
    <div>{{ landingsTijd }}</div>
}
