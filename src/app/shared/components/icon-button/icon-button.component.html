<button class="btn" [class]="btnColor()"  [type]="type()" [disabled]="disabled()"  (click)="buttonClicked($event)">
    <div class="d-flex">
        @if (faIcon) {
            <fa-icon [icon]='faIcon' [flip]='flip()' [size]='size()'/>
        } @if (toonTekst || !toonKlein()) {
        <div [class.ms-3]="tekst().length > 0 && faIcon">{{ tekst() }}</div>
    }
    </div>
</button>
