@if (success) {
    <div
            id=successOverlay
            [ngClass]="showSuccess === true ? 'show' : ''"
            class="alert alert-success alert-dismissable"
            role="alert">
        @if (success.titel) {
            <div class="fw-bold">{{ success.titel }}</div>
        } @if (success.beschrijving) {
        <div>{{ success.beschrijving }}</div>
    }
    </div>
}
