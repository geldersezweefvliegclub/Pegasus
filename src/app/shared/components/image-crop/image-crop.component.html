<form #form='ngForm' (ngSubmit)="submit()">
    <input name="FILE" class="form-control my-3" type="file" (change)="fileChangeEvent($event)"
           accept='image/png, image/jpeg'/>
    <div>
        <image-cropper [imageChangedEvent]='imageChangedEvent'
                [maintainAspectRatio]="true"
                [aspectRatio]="1"
                [resizeToWidth]="512"
                [cropperMinWidth]="256"
                [onlyScaleDown]="true"
                [roundCropper]="true"
                [canvasRotation]="canvasRotation"
                [transform]="transform"
                alignImage="center"
                format="png"
                (imageCropped)="imageCropped($event)"
                (imageLoaded)="imageLoaded()"
                output='base64'
                (loadImageFailed)="loadImageFailed()"
        />
    </div>
    @if (imageChangedEvent) {
        <div class="d-flex justify-content-between">
            <div class="btn-group justify-content-center">
                <button class="btn btn-primary" (click)="rotateLeft()" type="button">
                    <fa-icon [icon]='draaienIcon'/>
                </button>
                <button class="btn btn-primary" (click)="rotateRight()" type="button">
                    <fa-icon [icon]='draaienIcon' flip='horizontal'/>
                </button>
                <button class="btn btn-primary" (click)="zoomIn()" type="button">
                    <fa-icon [icon]='zoomInIcon'/>
                </button>
                <button class="btn btn-primary" (click)="zoomOut()" type="button">
                    <fa-icon [icon]='zoomUitIcon'/>
                </button>
                <button class="btn btn-primary" (click)="flipHorizontal()" type="button">
                    <i class="bi bi-symmetry-vertical"></i>
                </button>
                <button class="btn btn-primary" (click)="flipVertical()" type="button">
                    <i class="bi bi-symmetry-horizontal"></i>
                </button>
                <button class="btn btn-primary" (click)="resetImage()">
                    <fa-icon [icon]='resetIcon'/>
                </button>
            </div>
            <app-icon-button [disabled]='!croppedImage' class="ms-2" type="submit" iconNaam="fas Upload"
                             tekst='Uploaden'/>
    </div>
    }
</form>
