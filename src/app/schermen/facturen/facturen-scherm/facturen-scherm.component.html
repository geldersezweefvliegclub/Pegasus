<app-error [error]='error'/>
<app-success [success]='success'/>

<app-pegasus-card [titel]="(mode === 'facturen') ? 'Facturen ' +jaar : 'Nog te doen ' + jaar"
                  subtitel="Maak contributie facturen"
                  [icon]="iconCardIcon"
                  [exportEnabled]="this.magExporten"
                  (Exporting)="exportDataset()">
    <div class="box h-100">
        <div id="data" class="data">
            <app-datatable id='facturengrid'
                    [pagination]="false"
                    [rowData]="data"
                    [columnDefs]="columns"
                    [loading]="isLoading"
                    [rowClassRules]="rowClassRules"
                    [multipleSelection]="!deleteMode"
                    [frameworkComponents]="frameworkComponents"
                           class='h-100 mt-n8'/>
        </div>
        <div class="row justify-content-start mt-2" id="toolbar">
            <div class="col-4">
                <div class="d-flex">

                    @if (mode === 'facturen') {
                        <app-icon-button class='toolbarBtn'
                                tekst="Nog te doen"
                                iconNaam="fas Filter" (btnClicked)="modeSwitch()"
                                         btnColor='btn-primary'/>
                    } @if (mode === 'nogTeDoen') {
                    <app-icon-button class='toolbarBtn'
                            tekst="Facturen"
                            iconNaam="fas Filter" (btnClicked)="modeSwitch()"
                                     btnColor='btn-secondary'/>
                }

                </div>
            </div>
            <div class="col-8">
                <div class="row justify-content-between" id="zoekbar">
                    @if (mode === 'nogTeDoen') {
                        <div class="col-12 col-md-8 flex-grow-1"></div>
                    } @if (mode === 'facturen') {
                    <app-zoekbar class="col-12 col-md-8 flex-grow-1"
                                 [(zoekString)]="zoekString"
                                 (zoeken)='opvragen()'/>
                } @if (this.magVerwijderen && this.mode === 'facturen') {
                    <div class="col-4">
                        <div class="d-flex justify-content-end">
                            <app-icon-button class="toolbarBtn" tekst="Uploaden" iconNaam="fas BasketShopping"
                                             btnColor="btn btn-outline-primary"
                                             (btnClicked)='uploadenFacturen()'/>
                            @if (this.magVerwijderen && !deleteMode) {
                                <app-icon-button class="toolbarBtn" tekst="Verwijderen" iconNaam="far TrashAlt"
                                                 btnColor="btn-secondary"
                                                 (btnClicked)='deleteModeJaNee()'/>
                            } @if (deleteMode) {
                            <app-icon-button class="toolbarBtn" tekst="Terug" iconNaam="far ArrowAltCircleLeft"
                                             btnColor="btn btn-outline-primary"
                                             (btnClicked)='deleteModeJaNee()'/>
                        }
                        </div>
                    </div>
                } @if (this.mode === 'nogTeDoen') {
                    <div class="col-4">
                        <div class="d-flex justify-content-end">
                            <app-icon-button class="toolbarBtn" tekst="Maak facturen" iconNaam="fas LayerGroup"
                                             btnColor='btn-primary' (btnClicked)='maakFacturen()'/>
                        </div>
                    </div>
                }
                </div>
            </div>
        </div>
    </div>
</app-pegasus-card>

<app-factuur-uploaden/>
