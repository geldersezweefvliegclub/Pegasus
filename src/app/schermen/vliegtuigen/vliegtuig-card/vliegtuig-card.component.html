@if (vliegtuig) {
    <div class="kaart" [ngClass]="{nietInzetbaarKaart: vliegtuig.INZETBAAR === false}">
    <table>
        <tr>
            <td>
                @if (vliegtuig.toonLogboek) {
                    <button class="btn btn-noborder noLeftPadding" (click)="logboekButtonClicked()">
                        <fa-icon [icon]="logboekIcon" class="logboekBtn"></fa-icon>
                    </button>
                }
            </td>
            <td class="w-100">
                <b>
                    <div class="d-flex w-100 flex-row>">
                        <div class="me-1">{{ vliegtuig.REG_CALL }}:</div>
                        {{ vliegtuig.VLIEGTUIGTYPE }}
                    </div>
                </b>
            </td>
            <td>
                @if (vliegtuig.CLUBKIST) {
                    <button class="btn btn-noborder" (click)="journaalButtonClicked()">
                        <fa-icon [icon]="journaalIcon" class="journaalBtn"></fa-icon>
                    </button>
                }
            </td>
        </tr>
    </table>
        @if (vliegtuig.OPMERKINGEN) {
            <div class="d-flex w-100 justify-content-between">
                {{ vliegtuig.OPMERKINGEN }}
            </div>
        }
    <div class="d-flex w-100">
        <table class="w-100">
            <tr>
                <td class="w-100">
                    <img src="/assets/img/seat.png" alt="Stoel PIC"/>
                    @if (vliegtuig.ZITPLAATSEN === 2) {
                        <img src="/assets/img/seat.png" alt="Stoel inzittende"/>
                    }
                </td>
                @if (vliegtuig.magWijzigen) {
                    <td class="pt-1" style="vertical-align: bottom">
                        <div class="iconEdit">
                            <fa-icon [icon]="iconEdit" class="mx-2" (click)="editorButtonClicked()"></fa-icon>
                        </div>
                    </td>
                }
            </tr>
        </table>
    </div>
    </div>
}


<app-vliegtuig-editor></app-vliegtuig-editor>
