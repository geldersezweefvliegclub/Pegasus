<div class="telefoonBlok ">
    @if ((telefoon)) {
        <div class="telefoonRij">
            <div class="TMN"><b>T:</b></div>
            {{ telefoon }}
        </div>
    } @if ((mobiel)) {
    <div class="telefoonRij">
        <div class="TMN"><b>M:</b></div>
        {{ mobiel }}
    </div>
} @if ((noodnummer)) {
    <div class="telefoonRij">
        <div class="TMN"><b>N:</b></div>
        {{ noodnummer }}
    </div>
}
</div>
