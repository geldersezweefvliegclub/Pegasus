<app-error [error]="error"></app-error>
<app-success [success]="success"></app-success>
<app-agenda-editor></app-agenda-editor>

<app-pegasus-card titel="Agenda"
                  subtitel="Activiteiten"
                  [icon]="iconCardIcon">
    <div class="box h-100">
        <div id="data" class="data">
            <app-datatable
                    id="agendagrid"
                    [pagination]="true"
                    [rowData]="data"
                    [columnDefs]="columns"
                    [loading]="isLoading"
                    [frameworkComponents]="frameworkComponents"
                    (rowDoubleClicked)="openEditor($event)"
                    class="h-100 mt-n8"></app-datatable>
        </div>
        <div class="row" id="toolbar">
            <div class="col-12 d-flex justify-content-between mt-2">
                <div>
                    @if (this.magToevoegen) {
                        <div>
                            @if (!this.deleteMode) {
                                <app-icon-button class="toolbarBtn"
                                                 tekst="Toevoegen"
                                                 iconNaam="far PlusSquare" (btnClicked)="addAgenda()"
                                                 btnColor="btn-primary"></app-icon-button>
                            }
                        </div>
                    } @if (this.deleteMode) {
                    <div>
                        <app-status-button
                                class="toolbarBtn"
                                tekst="Archief"
                                [actief]="trashMode"
                                (btnClicked)="trashModeJaNee($event)"
                                iconNaam="fas Inbox">
                        </app-status-button>
                    </div>
                }
                </div>

                <div>
                    @if (this.magVerwijderen) {
                        <div class="d-flex justify-content-end">
                            @if (this.magVerwijderen && !deleteMode) {
                                <app-icon-button class="toolbarBtn" tekst="Verwijderen" iconNaam="far TrashAlt"
                                                 btnColor="btn-secondary"
                                                 (btnClicked)="deleteModeJaNee()"></app-icon-button>
                            } @if (deleteMode) {
                            <app-icon-button class="toolbarBtn" tekst="Terug" iconNaam="far ArrowAltCircleLeft"
                                             btnColor="btn btn-outline-primary"
                                             (btnClicked)="deleteModeJaNee()"></app-icon-button>
                        }
                        </div>
                    }
                </div>
            </div>
        </div>
    </div>
</app-pegasus-card>
