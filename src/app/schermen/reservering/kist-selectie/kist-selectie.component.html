<app-modal titel="Keuze van kisten">
    <div body>
        <table class="">
            @for (kist of clubVliegtuigen; track kist; let i = $index) {
                <tr>
                    <td>
                        <input type="checkbox"
                               class="form-check-inline"
                               [checked]="kist.Tonen" (change)="changeTonen(kist.ID)">
                    </td>
                    <td>{{ kist.REG_CALL }}</td>
                </tr>
            }
        </table>
    </div>
</app-modal>
