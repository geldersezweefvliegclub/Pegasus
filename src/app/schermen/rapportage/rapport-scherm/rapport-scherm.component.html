<div class="d-flex flex-row">
    @for (rapport of rapporten; track rapport; let i = $index) {

            <app-icon-button class="toolbarBtn" btnColor="btn-primary"
                             tekst="{{rapport.MenuItem}}"
                             (btnClicked)="toonRapport(i)"></app-icon-button>
    </div>
    }
</div>

<iframe width="100%" class="hoogteIframe" [src]="url" allowFullScreen="true">
</iframe>
