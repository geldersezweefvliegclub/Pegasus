<app-error [error]="error"></app-error>
<app-success [success]="success"></app-success>

<app-pegasus-card titel="Audit"
                  subtitel="Een overzicht van alle wijzigingen"
                  [icon]="iconCardIcon"
                  [exportEnabled]="this.magExporten"
                  (Exporting)="exportDataset()">
    <div class="box">
        <div class="d-flex h-100">
            <div class="col-9 h-100">
                <app-datatable
                        id="auditgrid"
                        [rowData]="data"
                        [columnDefs]="dataColumns"
                        [loading]="isLoading"
                        (rowSelected)="selectRow($event)"
                        class="h-100 mt-n8"></app-datatable>
            </div>
            @if (data) {
                <div class="col-3 kolomRechts ml-2">
                    <div class="table-rechts">
                        <table>
                            <tr>
                                <td colspan="2">
                                    <div class="header">Orgineel</div>
                                </td>
                            </tr>
                            @for (item of voor | keyvalue; track item) {
                                <tr>
                                    <td>
                                        <div class="auditlineKey">{{ item.key }}</div>
                                    </td>
                                    <td>
                                        <div class="auditline">{{ item.value }}</div>
                                    </td>
                                </tr>
                            }
                            <tr>
                                <td colspan="2">
                                    <div class="header">Data</div>
                                </td>
                            </tr>
                            @for (item of wijziging | keyvalue; track item) {
                                <tr>
                                    <td>
                                        <div class="auditlineKey">{{ item.key }}</div>
                                    </td>
                                    <td>
                                        <div class="auditline">{{ item.value }}</div>
                                    </td>
                                </tr>
                            }
                            <tr>
                                <td colspan="2">
                                    <div class="header">Resultaat</div>
                                </td>
                            </tr>
                            @for (item of resultaat | keyvalue; track item) {
                                <tr>
                                    <td>
                                        <div class="auditlineKey">{{ item.key }}</div>
                                    </td>
                                    <td>
                                        <div class="auditline">{{ item.value }}</div>
                                    </td>
                                </tr>
                            }
                        </table>
                    </div>
                </div>
            }
        </div>
        <div class="row justify-content-start mt-2" id="toolbar">
            <div class="col-10">
                <div class="row justify-content-between" id="zoekbar">
                    <app-zoekbar class="col-12 col-md-8 flex-grow-1"
                                 [(zoekString)]="zoekString"
                                 (zoeken)="opvragen()"></app-zoekbar>
                </div>
            </div>
        </div>
    </div>
</app-pegasus-card>
